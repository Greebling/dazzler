[package]
name = "deezer-client"
version = "1.0.1"
edition = "2024"
description = "Unofficial desktop client for deezer.com (not affiliated with Deezer)"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-plugin-global-shortcut = "2"

[target."cfg(not(windows))".dependencies]
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
